<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --background: #F6F1E9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--background); }
body { display: flex; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
@media (max-aspect-ratio: 2/3) {
  body { padding: 320px 0 693px; }
  img { object-fit: contain; }
}
</style>
</head>
<body><img src="ad.png" alt=""></body>
</html>
