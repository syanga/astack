<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --paper: #F6F1E9;
  --ink: #2B1D14;
  --muted: #6B5A4C;
  --accent: #B4532A;
  --on-accent: #FFFFFF;
  --headline-font: Georgia, "Times New Roman", serif;
  --body-font: system-ui, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
body {
  display: flex; flex-direction: column; padding: 160px;
  font-family: var(--body-font); color: var(--ink); -webkit-font-smoothing: antialiased;
}
.brand { display: flex; align-items: center; gap: 24px; font-size: 50px; font-weight: 700; }
.brand img { width: 88px; height: 88px; }
h1 {
  margin-top: 72px; font-family: var(--headline-font); font-size: 116px; line-height: 1.02;
  font-weight: 800; letter-spacing: -0.01em; text-wrap: balance;
}
.sub { margin-top: 36px; font-size: 54px; line-height: 1.3; color: var(--muted); }
.product { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin: 48px 0; }
.product img { max-width: 100%; max-height: 100%; object-fit: contain; }
.cta {
  align-self: flex-start; padding: 28px 56px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font-size: 54px; font-weight: 700;
}
footer { margin-top: 40px; font-size: 44px; line-height: 1.3; }
footer small { display: block; font-size: 44px; color: var(--muted); }
@media (max-aspect-ratio: 2/3) {
  body { padding: 360px 160px 733px; }
  h1 { font-size: 124px; }
}
</style>
</head>
<body>
<div class="brand"><img src="assets/logo.svg" alt="">Larkspur Coffee</div>
<h1>FRESH BEANS IN 48 HOURS</h1>
<p class="sub">Roasted on Monday, at your door by Wednesday.</p>
<div class="product"><img src="assets/product.svg" alt=""></div>
<div class="cta">Order a bag</div>
<footer>
  larkspur.example
  <small>Not affiliated with any coffee chain.</small>
</footer>
</body>
</html>
