name: Test stack

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ['3.10', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provision pinned scanner in a disposable repository
        shell: bash
        run: |
          git init "$RUNNER_TEMP/gitleaks-probe"
          python3 scripts/git_hooks.py install --repo "$RUNNER_TEMP/gitleaks-probe"
          echo "ASTACK_TEST_GITLEAKS=$RUNNER_TEMP/gitleaks-probe/.git/hooks/astack-gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests -v
